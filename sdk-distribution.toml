[macos]
commands = [
  ["xcrun", "swift", "--version"],
  ["cargo", "fetch", "--locked"],
  ["make", "check-distribution", "test-installed-consumers"],
]

[windows]
commands = [
  ["rustup", "install", "--no-self-update"],
  ["sdk-tooling", "python", "-m", "unittest", "discover", "-s", "distribution/tests"],
  [
    "sdk-tooling",
    "windows",
    "distribution/verify_windows.py",
    "--packaged-desktop",
    "--export-native",
  ],
]

[nuget]
pack = "distribution/pack_nuget.py"
