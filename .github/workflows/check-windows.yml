name: Windows x64 SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Test Rust and .NET
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
      GIT_TERMINAL_PROMPT: "0"
      CARGO_BUILD_TARGET: "x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: naviapps/sdk-tooling/.github/actions/test-rust-windows@0b6738f73b1b7081f75c212a79efeaf5ee62a92c
      - uses: actions/setup-dotnet@v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "10.0.403"
          architecture: x64
      - name: Build native binding library
        run: cargo build --locked -p system-permissions-ffi
      - name: Test .NET bindings
        run: |
          $env:SYSTEM_PERMISSIONS_NATIVE_LIBRARY = Join-Path $PWD "target/$env:CARGO_BUILD_TARGET/debug/system_permissions.dll"
          dotnet run --project bindings/dotnet/tests/SystemPermissions.Tests/SystemPermissions.Tests.csproj --configuration Release
